<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÓDULO - Gestão de Clientes</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Seu CSS Global Centralizado -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Script que aplica o tema instantaneamente -->
    <script src="theme-loader.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen font-sans flex flex-col">

    <!-- PAINEL PRINCIPAL -->
    <div id="app-dashboard" class="flex-1 flex flex-col md:flex-row min-h-screen">
        
       
<!-- MENU LATERAL INDEPENDENTE INJETADO AQUI    -->
<!-- ========================================== -->
<aside id="app-sidebar-container" class="w-full md:w-64 bg-cardbg border-b md:border-b-0 md:border-r border-cardborder p-4 flex flex-col justify-between md:h-screen md:sticky md:top-0 flex-shrink-0 overflow-y-auto no-print">
</aside>

        <!-- ÁREA DE CONTEÚDO PRINCIPAL: CLIENTES -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto space-y-6">
            
            <button id="btn-back" class="flex items-center gap-2 px-3 py-2 text-sm font-medium bg-darkbg border border-cardborder hover:border-blue-500 hover:text-blue-400 text-gray-400 rounded-lg transition-colors w-fit">
                ⬅️ Voltar
            </button>
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-white">Cadastro de Clientes</h1>
                    <p class="text-xs text-gray-400">Gerencie contatos, empresas e dados cadastrais</p>
                </div>
                <button id="btn-novo-cliente" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold px-4 py-2.5 rounded-lg transition-colors shadow-lg shadow-emerald-600/20">
                    + Novo Cliente
                </button>
            </div>

            <!-- BARRA DE PESQUISA -->
            <div class="bg-cardbg border border-cardborder p-4 rounded-xl">
                <input type="text" id="search-cliente" placeholder="🔍 Buscar cliente por Nome, Contato ou CPF/CNPJ..." class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- TABELA DE CLIENTES -->
            <div class="bg-cardbg border border-cardborder rounded-xl p-5 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-300">
                        <thead class="text-xs text-gray-400 border-b border-cardborder uppercase">
                            <tr>
                                <th class="p-3">Razão Social / Nome</th>
                                <th class="p-3">Contato</th>
                                <th class="p-3">E-mail</th>
                                <th class="p-3">Telefone</th>
                                <th class="p-3">CPF / CNPJ</th>
                                <th class="p-3">Endereço</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-clientes"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL CLIENTE (CRIAR / EDITAR) -->
    <div id="modal-cliente" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-cardbg border border-cardborder p-6 rounded-xl w-full max-w-lg space-y-4 my-8">
            <div class="flex justify-between items-center border-b border-cardborder pb-3">
                <h3 id="modal-cliente-titulo" class="text-lg font-bold text-white">Cadastrar Cliente</h3>
                <button class="btn-close-modal text-gray-400 hover:text-white font-bold">✕</button>
            </div>

            <input type="hidden" id="c-id" value="">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-400 mb-1">NOME / RAZÃO SOCIAL</label>
                    <input type="text" id="c-nome" placeholder="ex: Empresa XYZ Ltda" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">NOME DO CONTATO</label>
                    <input type="text" id="c-contato" placeholder="ex: João Silva" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">TELEFONE / WHATSAPP</label>
                    <input type="text" id="c-fone" placeholder="ex: (41) 99999-9999" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">E-MAIL</label>
                    <input type="email" id="c-email" placeholder="ex: contato@empresa.com" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">CPF OU CNPJ</label>
                    <input type="text" id="c-doc" placeholder="ex: 00.000.000/0001-00" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-400 mb-1">ENDEREÇO COMPLETO</label>
                    <input type="text" id="c-endereco" placeholder="ex: Rua Exemplo, 123 - Bairro - Cidade/UF" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-cardborder">
                <button class="btn-close-modal px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg">Cancelar</button>
                <button id="btn-salvar-cliente" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold">Salvar Cliente</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DA PÁGINA -->
<script type="module">
    // Cole estas duas linhas logo no começo do seu script!
    import { carregarMenuLateral } from './menu.js';
    carregarMenuLateral();

    // Importações do Firebase que já estão aí...
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // ... restante do seu código ...

    // SUBSTITUA a sua função window.logout antiga por este ouvinte de clique:
    document.body.addEventListener('click', (e) => {
        const btnOut = e.target.closest('#btn-logout-global');
        if (btnOut) {
            signOut(auth).then(() => { window.location.href = 'index.html'; });
        }
    });

    
</script>




    <script type="module" src="clientes.js">   </script>
</body>
</html>
